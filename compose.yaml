services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Ideiglenes: a host disk (/mnt/WDred) jelenleg majdnem 0 byte szabad
    # hellyel fut, ami a diagnosztikai adatgyűjtő (FTDC) írási hibáján
    # keresztül crash-loopba vitte a mongod-ot. Ez a --setParameter csak
    # kikapcsolja az FTDC-t (nem érint semmilyen tárolt adatot) — vedd ki,
    # ha felszabadult a hely.
    command: ['mongod', '--setParameter', 'diagnosticDataCollectionEnabled=false']
    volumes:
      - ./mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '9879:27017'
    networks:
      - internal
  backup:
    # Ugyanaz az image, mint a mongo — a mongodump, tar és gzip már benne van,
    # így nincs se build lépés, se újabb letöltés. Az ütemezést a script végzi.
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # A mentések a hoston is kezelhetők maradjanak: a konténer a host
    # felhasználó uid-jével ír, nem rootként.
    user: '${BACKUP_UID:-1000}:${BACKUP_GID:-1000}'
    environment:
      MONGO_URL: mongodb://mongo:27017/filler
      BACKUP_DIR: /backups
      TZ: Europe/Budapest
      KEEP_HOURLY_HOURS: 24
      KEEP_DAILY_DAYS: 14
    volumes:
      - ./backups:/backups
      # Bind mount, nem image-be sütve: a script szerkesztése után elég egy
      # `docker compose restart backup`, nem kell újraépíteni.
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    healthcheck:
      # A service hibatűrő, tehát bukó mentések mellett is futva marad. Ez
      # teszi láthatóvá, ha tartósan nem születik friss archívum.
      test: ['CMD-SHELL', 'find /backups -name "kassza-*.tar.gz" -mmin -90 | grep -q .']
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 2m
    networks:
      - internal
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017/filler
      PORT: 3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 8080
      API_URL: http://api:3000
    ports:
      - '8090:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      caddy: bill.p1ckle.xyz
      caddy.reverse_proxy: '{{upstreams 8080}}'
    networks:
      - caddy
      - internal
volumes:
  mongo-data:
networks:
  internal:
  caddy:
    external: true
