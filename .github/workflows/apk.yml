name: APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build típus (a release aláíráshoz kulcs-secretek kellenek)'
        type: choice
        options:
          - release
          - debug
        default: release
      api_base_url:
        description: 'Az APK-ba süthető API cím'
        type: string
        default: 'https://bill.p1ckle.xyz/api'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Aláíró kulcs
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release APK-hoz aláíró kulcs kell. Vedd fel az ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS és ANDROID_KEY_PASSWORD secreteket, vagy indítsd a workflow-t debug típussal."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/filler.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/filler.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > apps/mobile/keystore.properties

      - name: Webes build és cap sync
        run: npm run build:mobile
        env:
          MOBILE_API_BASE_URL: ${{ inputs.api_base_url }}

      - name: APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon "assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }}"

      - name: Aláíró kulcs törlése
        if: always()
        run: rm -f apps/mobile/keystore.properties "$RUNNER_TEMP/filler.jks"

      - name: Összegzés
        id: apk
        run: |
          path=$(find "apps/mobile/android/app/build/outputs/apk/${{ inputs.variant }}" -maxdepth 1 -name '*.apk' | head -1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          {
            echo "### APK"
            echo ""
            echo "- típus: \`${{ inputs.variant }}\`"
            echo "- API cím: \`${{ inputs.api_base_url }}\`"
            echo "- fájl: \`$(basename "$path")\` ($(du -h "$path" | cut -f1))"
            echo "- SHA-256: \`$(sha256sum "$path" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: filler-${{ inputs.variant }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
