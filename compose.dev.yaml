services:
  api:
    build:
      target: deps
    command: sh -c "cd apps/api && node --watch src/index.js"
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - api-node-modules:/repo/node_modules
    healthcheck:
      start_period: 30s

  web:
    build:
      target: deps
    command: sh -c "cd apps/web && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages/shared:/repo/packages/shared
      - web-node-modules:/repo/node_modules
    healthcheck:
      disable: true

volumes:
  api-node-modules:
  web-node-modules:
